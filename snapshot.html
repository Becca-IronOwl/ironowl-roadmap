<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IronOwl Cube9</title>
<style>
  :root {
    --navy: #16324F;
    --navy-dark: #0F2438;
    --cream: #F5F1E7;
    --gold: #C9971F;
    --gold-fill: #F6DFA0;
    --teal-tint: #DCEAF0;
    --teal-border: #5B8FA8;
    --card-border: #D8D4C6;
    --text-muted: #6B7680;
    --danger: #B23B3B;
    --danger-bg: #FBEAEA;
    --green: #2F7D5C;
    --green-bg: #E4F3EC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Calibri, Arial, sans-serif;
    background: var(--cream);
    color: var(--navy);
  }
  #app { max-width: 1340px; margin: 0 auto; padding: 28px 20px 80px; }

  /* Two-column shell: roadmap on the left (capped so the board looks unchanged),
     to-do list on the right. Stacks on narrower screens. */
  .layout { display: flex; gap: 28px; align-items: flex-start; justify-content: center; }
  .main-col { flex: 1 1 auto; max-width: 980px; min-width: 0; }
  .todo-col { flex: 0 0 300px; position: sticky; top: 24px; align-self: flex-start; max-height: calc(100vh - 48px); overflow-y: auto; }
  @media (max-width: 1180px) {
    .layout { flex-direction: column; align-items: stretch; }
    .main-col { max-width: none; }
    .todo-col { flex-basis: auto; width: 100%; position: static; max-height: none; }
  }

  .topbar { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; gap: 16px; }
  .topbar h1 { font-size: 22px; margin: 0 0 4px 0; letter-spacing: 0.2px; }
  .topbar .sub { font-size: 13px; color: var(--text-muted); }
  .topbar-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
  .icon-btn {
    background: #fff; border: 1px solid var(--card-border); border-radius: 6px;
    padding: 6px 10px; font-size: 12px; color: var(--navy); cursor: pointer;
  }
  .icon-btn:hover { background: var(--teal-tint); }

  .breadcrumb { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 13px; margin-bottom: 16px; color: var(--text-muted); }
  .breadcrumb .crumb { cursor: pointer; padding: 2px 4px; border-radius: 4px; }
  .breadcrumb .crumb:hover { background: var(--teal-tint); color: var(--navy); }
  .breadcrumb .crumb.current { color: var(--navy); font-weight: 600; cursor: default; }
  .breadcrumb .crumb.current:hover { background: none; }
  .breadcrumb .sep { color: #B9C4CC; }

  .current-card {
    background: var(--navy); color: #fff; border-radius: 12px; padding: 20px 22px;
    margin-bottom: 22px; position: relative;
  }
  .current-card .kicker { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #9FC3D6; margin-bottom: 6px; }
  .current-card .title-row { display: flex; align-items: flex-start; gap: 10px; }
  .current-card h2 { font-size: 24px; margin: 0; line-height: 1.3; flex: 1; }
  .current-card textarea.title-edit {
    font-size: 24px; font-weight: 600; line-height: 1.3; flex: 1; background: rgba(255,255,255,0.08);
    color: #fff; border: 1px solid rgba(255,255,255,0.35); border-radius: 6px; padding: 6px 8px;
    font-family: inherit; resize: vertical; min-height: 40px;
  }
  .current-card .meta-row { display: flex; gap: 18px; margin-top: 14px; flex-wrap: wrap; }
  .current-meta-field { display: flex; flex-direction: column; gap: 4px; }
  .current-meta-field label { font-size: 11px; color: #9FC3D6; text-transform: uppercase; letter-spacing: 0.5px; }
  .current-meta-field input, .current-meta-field select {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); color: #fff;
    border-radius: 6px; padding: 6px 8px; font-size: 13px; font-family: inherit;
  }
  .current-meta-field input::placeholder { color: rgba(255,255,255,0.5); }
  .ghost-btn {
    background: transparent; border: 1px solid rgba(255,255,255,0.4); color: #fff;
    border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer;
  }
  .ghost-btn:hover { background: rgba(255,255,255,0.12); }
  .gold-btn {
    background: var(--gold-fill); border: 1px solid var(--gold); color: #4A3A0F;
    border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer; font-weight: 600;
  }
  .gold-btn:hover { filter: brightness(0.96); }

  .children-heading { font-size: 13px; color: var(--text-muted); margin: 0 0 10px 2px; text-transform: uppercase; letter-spacing: 0.5px; }
  .children-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }

  .board {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    margin-bottom: 10px; border: 2px solid var(--navy); border-radius: 12px; padding: 10px;
    background: #EDE9DC;
  }
  .board-cell {
    border-radius: 8px; padding: 10px 12px; min-height: 148px;
    display: flex; flex-direction: column; justify-content: space-between; position: relative;
  }
  .board-cell.center { background: var(--navy); color: #fff; }
  .board-cell.child { background: #fff; border: 1px solid var(--card-border); cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s; }
  .board-cell.child:hover { border-color: var(--teal-border); box-shadow: 0 0 0 2px rgba(91,143,168,0.15); }
  .board-cell.child.done { background: #EDF4EC; border-color: #C9DDCA; }
  .board-cell.empty { background: transparent; border: 1.5px dashed #C9C4B2; }
  .board-cell .cell-kicker { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.7; margin-bottom: 4px; }
  .board-cell.center .cell-kicker { color: #9FC3D6; }
  .board-cell .cell-body { flex: 1 1 auto; min-height: 0; }
  .board-cell .cell-title {
    font-size: 14px; font-weight: 600; line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
  }
  .board-cell.center .cell-title { font-size: 15px; -webkit-line-clamp: 3; }
  .board-cell .cell-sub {
    font-size: 11px; font-style: italic; line-height: 1.3; margin-top: 3px; color: var(--text-muted);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .board-cell.center .cell-sub { color: #9FC3D6; }
  .board-cell .cell-footer { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 8px; font-size: 10.5px; }
  .board-cell .cell-owner { color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .board-cell.center .cell-owner { color: #C6D6E0; }
  .board-cell .cell-count { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
  .board-cell.center .cell-count { color: #9FC3D6; }
  .board-controls { position: absolute; top: 6px; right: 6px; display: flex; gap: 2px; z-index: 5; }
  .board-controls .mini-btn { color: var(--text-muted); font-size: 12px; padding: 2px 4px; }
  .board-cell.center .board-controls .mini-btn { color: #cfe0ea; }
  .board-cell.center .board-controls .mini-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
  .dot-not-started { background: #B4B0A2; }
  .dot-in-progress { background: #5B8FA8; }
  .dot-done { background: var(--green); }
  .dot-blocked { background: var(--danger); }

  .board-cell .edit-form textarea, .board-cell .edit-form input, .board-cell .edit-form select {
    font-size: 12px; padding: 5px 6px;
  }
  .board-cell.center .edit-form textarea, .board-cell.center .edit-form input, .board-cell.center .edit-form select {
    background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.35); color: #fff;
  }
  .board-cell.center .edit-form input::placeholder { color: rgba(255,255,255,0.5); }
  .board-cell.center .cancel-btn { background: transparent; border-color: rgba(255,255,255,0.4); color: #fff; }

  .overflow-heading { font-size: 12px; color: var(--text-muted); margin: 4px 0 8px 2px; }
  .board-note { font-size: 11.5px; color: var(--text-muted); margin: 0 0 16px 2px; }

  .team-lists { margin-top: 44px; padding-top: 24px; border-top: 1px solid var(--card-border); }
  .team-lists h2 { font-size: 18px; margin: 0 0 4px 0; color: var(--navy); }
  .team-lists .sub { font-size: 13px; color: var(--text-muted); margin-bottom: 16px; }
  .list-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .list-tab {
    background: #fff; border: 1px solid var(--card-border); border-radius: 999px;
    padding: 7px 16px; font-size: 13px; cursor: pointer; color: var(--navy);
  }
  .list-tab:hover { border-color: var(--teal-border); }
  .list-tab.active { background: var(--navy); color: #fff; border-color: var(--navy); }
  .list-tab .count { opacity: 0.7; margin-left: 4px; }

  .list-panel-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 14px; }
  .list-entries { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
  .list-row {
    background: #fff; border: 1px solid var(--card-border); border-radius: 10px;
    padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 6px 22px; align-items: flex-start;
    position: relative;
  }
  .list-field { display: flex; flex-direction: column; gap: 2px; min-width: 110px; }
  .list-field.grow { flex: 1; min-width: 180px; }
  .list-field label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); }
  .list-field .val { font-size: 13.5px; color: var(--navy); word-break: break-word; }
  .list-field .val.empty { color: var(--text-muted); font-style: italic; opacity: 0.7; }
  .list-row-controls { position: absolute; top: 10px; right: 10px; display: flex; gap: 4px; z-index: 5; }

  .list-add-form {
    background: #fff; border: 1.5px dashed var(--card-border); border-radius: 10px; padding: 14px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .list-add-form .fields-row { display: flex; flex-wrap: wrap; gap: 10px; }
  .list-add-form .field-wrap { display: flex; flex-direction: column; gap: 4px; min-width: 150px; flex: 1; }
  .list-add-form .field-wrap.grow { flex: 2; min-width: 220px; }
  .list-add-form label { font-size: 11px; color: var(--text-muted); }
  .list-add-form input, .list-add-form select {
    font-family: inherit; font-size: 13px; padding: 7px 9px; border: 1px solid var(--card-border); border-radius: 6px;
  }
  .list-add-toggle {
    border: 1.5px dashed var(--card-border); border-radius: 10px; padding: 12px; text-align: center;
    color: var(--text-muted); cursor: pointer; font-size: 13px;
  }
  .list-add-toggle:hover { border-color: var(--teal-border); color: var(--navy); background: #fff; }
  .list-empty { font-size: 13px; color: var(--text-muted); padding: 14px 2px; }

  .child-card {
    background: #fff; border: 1px solid var(--card-border); border-radius: 10px; padding: 14px 16px;
    display: flex; flex-direction: column; gap: 8px; cursor: pointer; position: relative;
    transition: border-color 0.15s;
  }
  .child-card:hover { border-color: var(--teal-border); }
  .child-card.done { background: #EDF4EC; border-color: #C9DDCA; }
  .child-card .card-title { font-size: 15px; font-weight: 600; line-height: 1.35; padding-right: 40px; }
  .child-card .card-sub { font-size: 12px; font-style: italic; color: var(--text-muted); line-height: 1.35; margin-top: -4px; }
  .card-controls { position: absolute; top: 10px; right: 10px; display: flex; gap: 4px; z-index: 5; }
  .mini-btn {
    background: transparent; border: none; color: var(--text-muted); cursor: pointer;
    font-size: 13px; padding: 3px 5px; border-radius: 4px; line-height: 1;
  }
  .mini-btn:hover { background: var(--teal-tint); color: var(--navy); }

  .card-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 2px; }
  .owner-tag { font-size: 12px; color: var(--text-muted); }
  .owner-tag.empty { font-style: italic; opacity: 0.7; }
  .status-pill { font-size: 11px; padding: 3px 9px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
  .status-not-started { background: #ECEAE2; color: #6B6656; }
  .status-in-progress { background: var(--teal-tint); color: #235167; }
  .status-done { background: var(--green-bg); color: var(--green); }
  .status-blocked { background: var(--danger-bg); color: var(--danger); }
  .subtask-count { font-size: 11px; color: var(--text-muted); }

  .edit-form { display: flex; flex-direction: column; gap: 8px; }
  .edit-form textarea, .edit-form input, .edit-form select {
    font-family: inherit; font-size: 13px; padding: 6px 8px; border: 1px solid var(--card-border);
    border-radius: 6px; width: 100%;
  }
  .edit-form textarea { resize: vertical; min-height: 44px; }
  .edit-form textarea.desc-edit { min-height: 30px; font-style: italic; }
  .edit-row { display: flex; gap: 8px; }
  .edit-actions { display: flex; gap: 6px; justify-content: flex-end; }
  .edit-actions button { font-size: 12px; padding: 5px 10px; border-radius: 6px; cursor: pointer; }
  .save-btn { background: var(--navy); color: #fff; border: none; }
  .cancel-btn { background: #fff; border: 1px solid var(--card-border); color: var(--navy); }

  .add-card {
    border: 1.5px dashed var(--card-border); border-radius: 10px; padding: 14px 16px;
    display: flex; align-items: center; justify-content: center; color: var(--text-muted);
    cursor: pointer; font-size: 14px; min-height: 76px;
  }
  .add-card:hover { border-color: var(--teal-border); color: var(--navy); background: #fff; }

  .new-task-form {
    background: #fff; border: 1px solid var(--card-border); border-radius: 10px; padding: 14px 16px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .new-task-form input { font-family: inherit; font-size: 13px; padding: 7px 9px; border: 1px solid var(--card-border); border-radius: 6px; }

  .empty-state { text-align: center; color: var(--text-muted); font-size: 13px; padding: 30px 10px; }

  .status-banner {
    font-size: 12px; padding: 8px 12px; border-radius: 6px; margin-bottom: 14px;
  }
  .status-banner.error { background: var(--danger-bg); color: var(--danger); }
  .status-banner.info { background: var(--teal-tint); color: #235167; }

  .loading { text-align: center; padding: 60px 0; color: var(--text-muted); font-size: 14px; }

  /* Offline read-only snapshot (built nightly by the backup job) */
  .snapshot-banner {
    background: var(--gold-fill); border: 1px solid var(--gold); color: #4A3A0F;
    font-size: 12.5px; padding: 9px 14px; border-radius: 8px; margin-bottom: 16px;
  }
  .snapshot-banner a { color: #4A3A0F; }
  body.readonly .board-controls,
  body.readonly .card-controls,
  body.readonly .list-row-controls,
  body.readonly .todo-del,
  body.readonly .todo-add,
  body.readonly .list-add-toggle,
  body.readonly .board-note span { display: none !important; }

  /* To-do list */
  .todo-panel { background: #fff; border: 1px solid var(--card-border); border-radius: 12px; padding: 16px 16px 18px; }
  .todo-panel h2 { font-size: 13px; margin: 0 0 12px; color: var(--navy); text-transform: uppercase; letter-spacing: 0.5px; }
  .todo-add { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .todo-add input {
    font-family: inherit; font-size: 13px; padding: 7px 9px; border: 1px solid var(--card-border);
    border-radius: 6px; width: 100%; color: var(--navy);
  }
  .todo-add-row { display: flex; gap: 6px; align-items: center; }
  .todo-add-row .todo-name { flex: 1 1 auto; min-width: 0; }
  .todo-add-row .todo-date { flex: 0 1 auto; min-width: 0; }
  .todo-ws {
    flex: 1 1 auto; min-width: 0; font-family: inherit; font-size: 12px; color: var(--navy);
    padding: 7px 8px; border: 1px solid var(--card-border); border-radius: 6px; background: #fff;
  }
  .todo-add-btn {
    background: var(--navy); color: #fff; border: none; border-radius: 6px;
    padding: 7px 12px; font-size: 12px; font-weight: 600; cursor: pointer; flex-shrink: 0;
  }
  .todo-add-btn:hover { background: var(--navy-dark); }
  .todo-ws-tag {
    background: var(--teal-tint); color: #235167; border-radius: 4px;
    padding: 0 5px; font-size: 10.5px; font-weight: 600;
  }
  .todo-item.done .todo-ws-tag { background: #E9E6DA; color: #9DAA9C; }
  .todo-list { list-style: none; margin: 0; padding: 0; }
  .todo-item { display: flex; align-items: flex-start; gap: 9px; padding: 9px 2px; border-top: 1px solid #EEE9DB; }
  .todo-item:first-child { border-top: none; }
  .todo-item input[type="checkbox"] {
    margin: 1px 0 0; width: 15px; height: 15px; accent-color: var(--navy); cursor: pointer; flex-shrink: 0;
  }
  .todo-body { flex: 1; min-width: 0; }
  .todo-text { font-size: 13px; line-height: 1.35; color: var(--navy); word-break: break-word; }
  .todo-meta { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
  .todo-meta .overdue { color: var(--danger); font-weight: 600; }
  .todo-del {
    background: transparent; border: none; color: #C7C1AF; cursor: pointer;
    font-size: 12px; padding: 2px 3px; line-height: 1; flex-shrink: 0; opacity: 0.5;
  }
  .todo-del:hover { opacity: 1; color: var(--danger); }
  .todo-item.done {
    background: #EDF4EC; border-top-color: transparent; border-radius: 8px;
    padding-left: 8px; padding-right: 8px; margin-top: 3px;
  }
  .todo-item.done + .todo-item:not(.done) { border-top-color: transparent; }
  .todo-item.done .todo-text { text-decoration: line-through; color: var(--text-muted); }
  .todo-item.done .todo-meta { color: #9DAA9C; }
  .todo-item.done .todo-meta .overdue { color: #9DAA9C; font-weight: 400; }
  .todo-item.done input[type="checkbox"] { accent-color: var(--green); }
  .todo-empty { font-size: 12.5px; color: var(--text-muted); padding: 6px 2px; }

  /* Owner picker + "assigned to <name>" report */
  .owner-select {
    background: #fff; border: 1px solid var(--card-border); border-radius: 6px;
    padding: 6px 8px; font-size: 12px; color: var(--navy); font-family: inherit;
    cursor: pointer; max-width: 190px;
  }
  .owner-select:hover { border-color: var(--teal-border); }
  .report-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .report-head h2 { font-size: 20px; margin: 0; color: var(--navy); }
  .report-head-actions { display: flex; align-items: center; gap: 8px; }
  .report-count { font-size: 12px; color: var(--text-muted); }
  .report-group { margin-bottom: 22px; }
  .report-group h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin: 0 0 8px 2px; }
  .report-row {
    background: #fff; border: 1px solid var(--card-border); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 8px; cursor: pointer; transition: border-color 0.15s;
  }
  .report-row:hover { border-color: var(--teal-border); }
  .report-row.static, .report-row.static:hover { cursor: default; border-color: var(--card-border); }
  .report-row .rr-title { font-size: 14px; font-weight: 600; color: var(--navy); line-height: 1.35; }
  .report-row .rr-title.rr-done { text-decoration: line-through; color: var(--text-muted); }
  .report-row .rr-path { font-size: 11.5px; color: var(--text-muted); margin-top: 3px; }
  .report-row .rr-sub { font-size: 11.5px; font-style: italic; color: var(--text-muted); margin-top: 2px; }
  .report-row .rr-foot { display: flex; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
  .report-empty { font-size: 13px; color: var(--text-muted); line-height: 1.6; padding: 18px 2px; }

  @media print {
    .topbar-actions, .todo-col, .team-lists, .breadcrumb { display: none !important; }
    .layout { display: block !important; }
    .report-row { break-inside: avoid; border-color: #bbb; }
    .report-row:hover { border-color: #bbb; }
  }
</style>

const SUPABASE_URL = "https://kbrjcdnivmrfusdoxagh.supabase.co";

// Snapshot mode: the nightly backup job injects a window.SNAPSHOT_DATA global

const SNAP = (typeof window !== "undefined" && window.SNAPSHOT_DATA) ? window.SNAPSHOT_DATA : null;
const READONLY = !!SNAP;

  categories.forEach(cat => {
    const catId = uid();
    nodes[catId] = { id: catId, title: cat.name, owner: "", status: "Not started", parentId: rootId, children: [] };
    nodes[rootId].children.push(catId);
    cat.actions.forEach(actionTitle => {
      const actId = uid();
      nodes[actId] = { id: actId, title: actionTitle, owner: "", status: "Not started", parentId: catId, children: [] };
      nodes[catId].children.push(actId);
    });

  return { rootId, nodes };
}

// Build the in-memory { rootId, nodes } shape the rest of the app expects
// from a flat list of task rows.
function buildTree(rows) {
  const nodes = {};
  rows.forEach(r => {
    nodes[r.id] = {
      id: r.id, title: r.title, description: r.description || "",
      owner: r.owner || "", status: r.status || "Not started",
      parentId: r.parent_id, children: [], _sort: r.sort_order || 0
    };
  });
  rows.forEach(r => {
    if (r.parent_id && nodes[r.parent_id]) nodes[r.parent_id].children.push(r.id);
  });
  Object.values(nodes).forEach(n => n.children.sort((a, b) => nodes[a]._sort - nodes[b]._sort));
  const root = rows.find(r => !r.parent_id) || rows[0];
  return { rootId: root ? root.id : "root", nodes: nodes };
}

async function loadTree(allowSeed = true) {
  if (SNAP) {
    tree = buildTree(SNAP.tasks || []);
    if (!tree.nodes[currentId]) currentId = tree.rootId;
    render();
    return;
  }
  try {
    const { data, error } = await sb.from("tasks").select("*");
    if (error) throw error;
    if (data && data.length) {
      tree = buildTree(data);
      if (!tree.nodes[currentId]) currentId = tree.rootId;
    } else if (allowSeed) {
      // Empty database (fresh project): plant the default roadmap once. If two
      // browsers race to do this, the loser's insert fails on the primary key -
      // that's fine, it just reloads the winner's rows.
      try { await seedTasks(); } catch (seedErr) { console.warn("seed skipped:", seedErr.message); }
      return loadTree(false);
    }
  } catch (err) {
    console.error("Load failed:", err);
    if (!tree) bannerError("Couldn't reach the database. Give it a moment and hit Refresh.");
    else bannerError("Couldn't reach the database - showing the last data loaded.");
  }
  render();
}

// Insert task rows parents-first so the parent_id foreign key is always satisfied.
async function insertTasksInOrder(rows) {
  const done = new Set();
  let remaining = rows.slice();
  while (remaining.length) {
    const ready = remaining.filter(r => !r.parent_id || done.has(r.parent_id));
    if (!ready.length) throw new Error("tasks have no reachable root");
    const { error } = await sb.from("tasks").insert(ready);
    if (error) throw error;
    ready.forEach(r => done.add(r.id));
    remaining = remaining.filter(r => !done.has(r.id));
  }
}

async function seedTasks() {
  const seed = seedTree();
  const rows = [];
  Object.values(seed.nodes).forEach(n => {
    const sibs = n.parentId ? seed.nodes[n.parentId].children : [];
    rows.push({
      id: n.id, parent_id: n.parentId, title: n.title,
      owner: n.owner || "", status: n.status || "Not started",
      sort_order: n.parentId ? sibs.indexOf(n.id) : 0
    });
  });
  await insertTasksInOrder(rows);
}

function getNode(id) { return tree.nodes[id]; }

function getPath(id) {
  const path = [];
  let n = getNode(id);
  while (n) {
    path.unshift(n);
    n = n.parentId ? getNode(n.parentId) : null;
  }
  return path;
}

function collectDescendants(id) {
  const ids = [id];
  const node = getNode(id);
  if (node) {
    node.children.forEach(childId => { ids.push(...collectDescendants(childId)); });
  }
  return ids;
}

window.navigateTo = function(id) {
  currentId = id;
  editingId = null;
  addingChildOf = null;
  render();
};

window.startEdit = function(id, ev) {
  if (ev) ev.stopPropagation();
  if (READONLY) return;
  editingId = id;
  addingChildOf = null;
  render();
};

window.cancelEdit = function() {
  editingId = null;
  render();
};

window.saveEdit = async function(id) {
  const titleEl = document.getElementById("edit-title-" + id);
  const descEl = document.getElementById("edit-desc-" + id);
  const ownerEl = document.getElementById("edit-owner-" + id);
  const statusEl = document.getElementById("edit-status-" + id);
  const title = titleEl.value.trim();
  if (!title) { titleEl.style.borderColor = "#B23B3B"; return; }
  const node = getNode(id);
  const patch = { title: title, updated_at: new Date().toISOString() };
  if (descEl) patch.description = descEl.value.trim();
  // The root goal's edit form has no owner/status inputs - guard for that.
  if (ownerEl) patch.owner = ownerEl.value.trim();
  if (statusEl) patch.status = statusEl.value;
  node.title = patch.title;                              // optimistic
  if (descEl) node.description = patch.description;
  if (ownerEl) node.owner = patch.owner;
  if (statusEl) node.status = patch.status;
  editingId = null;
  render();
  const { error } = await sb.from("tasks").update(patch).eq("id", id);
  if (error) { console.error(error); bannerError(); await loadTree(false); }
};

window.deleteNode = async function(id, ev) {
  if (ev) ev.stopPropagation();
  if (READONLY) return;
  const node = getNode(id);
  const childCount = collectDescendants(id).length - 1;
  const msg = childCount > 0
    ? 'Delete "' + node.title + '" and its ' + childCount + ' subtask(s)? This cannot be undone.'
    : 'Delete "' + node.title + '"?';
  if (!window.confirm(msg)) return;
  const parentId = node.parentId;
  collectDescendants(id).forEach(did => { delete tree.nodes[did]; });  // optimistic
  const parent = getNode(parentId);
  if (parent) parent.children = parent.children.filter(cid => cid !== id);
  if (currentId === id || !tree.nodes[currentId]) currentId = parentId || tree.rootId;
  render();
  // The parent_id foreign key cascades the delete to every descendant row.
  const { error } = await sb.from("tasks").delete().eq("id", id);
  if (error) { console.error(error); bannerError(); await loadTree(false); }
};

window.startAddChild = function(parentId) {
  if (READONLY) return;
  addingChildOf = parentId;
  editingId = null;
  render();
  setTimeout(() => {
    const el = document.getElementById("new-task-input");
    if (el) el.focus();
  }, 0);
};

window.cancelAddChild = function() {
  addingChildOf = null;
  render();
};

window.confirmAddChild = async function(parentId) {
  const input = document.getElementById("new-task-input");
  const title = input.value.trim();
  if (!title) { input.style.borderColor = "#B23B3B"; return; }
  const id = uid();
  const sortOrder = Date.now();
  tree.nodes[id] = { id, title, description: "", owner: "", status: "Not started", parentId, children: [], _sort: sortOrder };
  getNode(parentId).children.push(id);
  addingChildOf = null;
  render();
  const { error } = await sb.from("tasks").insert({
    id: id, parent_id: parentId, title: title, owner: "", status: "Not started", sort_order: sortOrder
  });
  if (error) { console.error(error); bannerError(); await loadTree(false); }
};

window.handleNewTaskKey = function(ev, parentId) {
  if (ev.key === "Enter") window.confirmAddChild(parentId);
  if (ev.key === "Escape") window.cancelAddChild();
};

window.dismissBanner = function() {
  banner = null;

};

// The default roadmap is planted once, automatically, only when the database
// is completely empty. There is deliberately no user-facing "reset everything"
// button - it was too easy to wipe the whole team's roadmap by accident.

window.refreshFromStorage = async function() {
  banner = null;
  await Promise.all([loadTree(false), loadLists(), loadTodos()]);
};

// Live updates: when anyone changes a row, pull the latest into open browsers.
// Skipped while this user has an edit form open or a field focused, so their
// in-progress work isn't yanked out from under them.
function subscribeToLiveUpdates() {
  if (SNAP || !sb) return;   // snapshot copy: no live connection
  let timer = null;
  const reload = () => {
    if (editingId || addingChildOf || addingToList || editingListEntry) return;
    const ae = document.activeElement;
    if (ae && ae.id && (ae.id.indexOf("todo-") === 0 || ae.id.indexOf("list-") === 0)) return;
    clearTimeout(timer);
    timer = setTimeout(() => {
      loadTree(false);
      loadTodos();
      loadLists();
    }, 250);
  };
  sb.channel("roadmap_live")
    .on("postgres_changes", { event: "*", schema: "public", table: "tasks" }, reload)
    .on("postgres_changes", { event: "*", schema: "public", table: "todos" }, reload)
    .on("postgres_changes", { event: "*", schema: "public", table: "list_entries" }, reload)
    .subscribe();
}

function escapeHtml(str) {

let listsData = { resources: [], process: [], moonshot: [] };
let activeListTab = "resources";
let addingToList = null;
let editingListEntry = null;

function groupListRows(rows) {
  const grouped = { resources: [], process: [], moonshot: [] };
  (rows || []).forEach(r => {
    if (grouped[r.list]) grouped[r.list].push(Object.assign({ id: r.id, createdAt: r.created_at }, r.data || {}));
  });
  Object.keys(grouped).forEach(k =>
    grouped[k].sort((a, b) => String(b.createdAt || "").localeCompare(String(a.createdAt || ""))));
  return grouped;
}

async function loadLists() {
  if (SNAP) { listsData = groupListRows(SNAP.list_entries); render(); return; }
  try {
    const { data, error } = await sb.from("list_entries").select("*").order("created_at", { ascending: false });
    if (error) throw error;
    listsData = groupListRows(data);
  } catch (err) {
    console.error("List load failed:", err);
    // Keep whatever is already in memory rather than blanking the lists.
  }
  render();
}

window.switchListTab = function(key) {
  activeListTab = key;
  addingToList = null;
  editingListEntry = null;
  render();
};

window.startAddListEntry = function(listKey) {
  if (READONLY) return;
  addingToList = listKey;
  editingListEntry = null;
  render();
};

window.cancelAddListEntry = function() {
  addingToList = null;
  render();
};

window.confirmAddListEntry = async function(listKey) {
  const schema = LIST_SCHEMAS[listKey];
  const data = {};
  let firstFieldEl = null;
  let hasValue = false;
  schema.fields.forEach(f => {
    const el = document.getElementById("list-new-" + f.id);
    if (!firstFieldEl) firstFieldEl = el;
    const val = el ? el.value.trim() : "";
    data[f.id] = val;
    if (f.id === schema.fields[0].id && val) hasValue = true;
  });
  if (!hasValue) {
    if (firstFieldEl) firstFieldEl.style.borderColor = "#B23B3B";
    return;
  }
  const id = uid();
  listsData[listKey].unshift(Object.assign({ id: id, createdAt: new Date().toISOString() }, data));
  addingToList = null;
  render();
  const { error } = await sb.from("list_entries").insert({ id: id, list: listKey, data: data });
  if (error) { console.error(error); bannerError(); await loadLists(); }
};

window.startEditListEntry = function(listKey, id, ev) {
  if (ev) ev.stopPropagation();
  if (READONLY) return;
  editingListEntry = listKey + ":" + id;
  addingToList = null;
  render();
};

window.cancelEditListEntry = function() {
  editingListEntry = null;
  render();
};

window.saveEditListEntry = async function(listKey, id) {
  const schema = LIST_SCHEMAS[listKey];
  const entry = listsData[listKey].find(e => e.id === id);
  const data = {};
  schema.fields.forEach(f => {
    const el = document.getElementById("list-edit-" + f.id + "-" + id);
    const val = el ? el.value.trim() : (entry[f.id] || "");
    data[f.id] = val;
    entry[f.id] = val;
  });
  editingListEntry = null;
  render();
  const { error } = await sb.from("list_entries").update({ data: data }).eq("id", id);
  if (error) { console.error(error); bannerError(); await loadLists(); }
};

window.deleteListEntry = async function(listKey, id, ev) {
  if (ev) ev.stopPropagation();
  if (READONLY) return;
  if (!window.confirm("Delete this entry?")) return;
  listsData[listKey] = listsData[listKey].filter(e => e.id !== id);
  render();
  const { error } = await sb.from("list_entries").delete().eq("id", id);
  if (error) { console.error(error); bannerError(); await loadLists(); }
};

// ---------------------------------------------------------------------------
// To-do list (right-hand column). One row per to-do in the `todos` table.
// DB columns body/assignee map to the in-memory text/name used by the render code.
// ---------------------------------------------------------------------------
let todos = [];

function mapTodoRow(r) {
  return {
    id: r.id, text: r.body || "", name: r.assignee || "", deadline: r.deadline || "",
    done: !!r.done, completedAt: r.completed_at || null, createdAt: r.created_at,
    workstream: r.workstream_id || null   // which top-level workstream this to-do belongs to (null = General)
  };
}

async function loadTodos() {
  if (SNAP) {
    todos = (SNAP.todos || []).slice()
      .sort((a, b) => String(a.created_at || "").localeCompare(String(b.created_at || "")))
      .map(mapTodoRow);
    render();
    return;
  }
  try {
    const { data, error } = await sb.from("todos").select("*").order("created_at", { ascending: true });
    if (error) throw error;
    todos = (data || []).map(mapTodoRow);
  } catch (err) {
    console.error("To-do load failed:", err);
    // Keep whatever is already in memory.
  }
  render();
}

window.addTodo = async function() {
  if (READONLY) return;
  const textEl = document.getElementById("todo-text");
  const nameEl = document.getElementById("todo-name");
  const dateEl = document.getElementById("todo-deadline");
  const wsEl = document.getElementById("todo-workstream");
  const text = textEl.value.trim();
  if (!text) { textEl.style.borderColor = "#B23B3B"; return; }
  const wsId = wsEl && wsEl.value ? wsEl.value : null;
  const row = {
    id: uid(), body: text, assignee: nameEl.value.trim(), deadline: dateEl.value,
    done: false, workstream_id: wsId
  };
  todos.push(mapTodoRow(Object.assign({}, row, { completed_at: null, created_at: new Date().toISOString() })));
  render();
  setTimeout(() => {
    const el = document.getElementById("todo-text");
    if (el) el.focus();
  }, 0);
  const { error } = await sb.from("todos").insert(row);
  if (error) { console.error(error); bannerError(); await loadTodos(); }
};

window.handleTodoKey = function(ev) {
  if (ev.key === "Enter") window.addTodo();
};

window.toggleTodo = async function(id) {
  if (READONLY) return;
  const t = todos.find(x => x.id === id);
  if (!t) return;
  t.done = !t.done;
  t.completedAt = t.done ? Date.now() : null;
  render();
  const { error } = await sb.from("todos").update({ done: t.done, completed_at: t.completedAt }).eq("id", id);
  if (error) { console.error(error); bannerError(); await loadTodos(); }
};

window.deleteTodo = async function(id) {
  if (READONLY) return;
  todos = todos.filter(x => x.id !== id);
  render();
  const { error } = await sb.from("todos").delete().eq("id", id);
  if (error) { console.error(error); bannerError(); await loadTodos(); }
};

function formatDeadline(d) {
  if (!d) return "";
  const dt = new Date(d + "T00:00:00");
  if (isNaN(dt.getTime())) return escapeHtml(d);
  return dt.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

function isOverdue(d) {
  if (!d) return false;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const dt = new Date(d + "T00:00:00");
  return !isNaN(dt.getTime()) && dt < today;
}

// The top-level workstream that contains the node currently on the board
// (null when we're at the goal/root, i.e. "show all to-dos").
function viewWorkstreamId() {
  if (!tree || currentId === tree.rootId) return null;
  let n = tree.nodes[currentId];
  while (n && n.parentId && n.parentId !== tree.rootId) n = tree.nodes[n.parentId];
  return n && n.parentId === tree.rootId ? n.id : null;
}

function workstreamTitle(id) {
  return id && tree && tree.nodes[id] ? tree.nodes[id].title : null;
}

function renderTodoItem(t, showWs) {
  const parts = [];
  const wsName = showWs ? workstreamTitle(t.workstream) : null;
  if (wsName) parts.push('<span class="todo-ws-tag">' + escapeHtml(wsName) + '</span>');
  if (t.name) parts.push(escapeHtml(t.name));
  if (t.deadline) {
    const dl = formatDeadline(t.deadline);
    parts.push(!t.done && isOverdue(t.deadline) ? '<span class="overdue">' + dl + '</span>' : dl);
  }
  const meta = parts.length ? '<div class="todo-meta">' + parts.join(' · ') + '</div>' : '';
  return '<li class="todo-item' + (t.done ? ' done' : '') + '">' +
    '<input type="checkbox"' + (t.done ? ' checked' : '') + ' onchange="toggleTodo(\'' + t.id + '\')">' +
    '<div class="todo-body">' +
      '<div class="todo-text">' + escapeHtml(t.text) + '</div>' + meta +
    '</div>' +
    '<button class="todo-del" title="Delete" onclick="deleteTodo(\'' + t.id + '\')">✕</button>' +
  '</li>';
}

function renderTodoPanel() {
  // Decide what slice of to-dos to show and what to default the add form to.
  let list = todos;
  let heading = "To do";
  let addWs = "";          // pre-selected workstream in the add form
  let showWs = true;       // show each item's workstream tag on its row

  if (ownerFilter) {
    const target = normName(ownerFilter);
    list = todos.filter(t => normName(t.name) === target);
    heading = "To do &middot; " + escapeHtml(ownerFilter);
  } else {
    const wsId = viewWorkstreamId();
    if (wsId && tree.nodes[wsId]) {
      list = todos.filter(t => t.workstream === wsId);
      heading = "To do &middot; " + escapeHtml(tree.nodes[wsId].title);
      addWs = wsId;
      showWs = false;       // everything here is the same workstream
    }
  }

  const active = list.filter(t => !t.done);
  const done = list.filter(t => t.done).sort((a, b) => (a.completedAt || 0) - (b.completedAt || 0));
  const ordered = active.concat(done);

  const wsOptions = tree
    ? tree.nodes[tree.rootId].children.map(id => tree.nodes[id]).filter(Boolean)
        .map(n => '<option value="' + n.id + '"' + (n.id === addWs ? ' selected' : '') + '>' + escapeHtml(n.title) + '</option>')
        .join('')
    : "";
  const nameVal = ownerFilter ? ' value="' + escapeHtml(ownerFilter) + '"' : '';

  let html = '<div class="todo-panel">';
  html += '<h2>' + heading + '</h2>';
  html += '<div class="todo-add">' +
    '<input id="todo-text" placeholder="Add a to-do…" onkeydown="handleTodoKey(event)">' +
    '<div class="todo-add-row">' +
      '<input id="todo-name" class="todo-name" placeholder="Name"' + nameVal + '>' +
      '<input id="todo-deadline" class="todo-date" type="date" title="Deadline">' +
    '</div>' +
    '<div class="todo-add-row">' +
      '<select id="todo-workstream" class="todo-ws" title="Which workstream">' +
        '<option value=""' + (addWs === "" ? ' selected' : '') + '>General</option>' +
        wsOptions +
      '</select>' +
      '<button class="todo-add-btn" onclick="addTodo()">Add</button>' +
    '</div>' +
  '</div>';

  if (ordered.length === 0) {
    html += '<div class="todo-empty">Nothing here yet.</div>';
  } else {
    html += '<ul class="todo-list">' + ordered.map(t => renderTodoItem(t, showWs)).join('') + '</ul>';
  }
  html += '</div>';
  return html;
}

// ---------------------------------------------------------------------------
// "Assigned to <name>" report: one flat view of everything owned by a person,
// across the whole roadmap tree plus the to-do and team lists.
// ---------------------------------------------------------------------------
function normName(v) { return (v || "").trim().toLowerCase(); }

function allOwnerNames() {
  const map = new Map(); // normalized -> display form
  const add = v => { const k = normName(v); if (k && !map.has(k)) map.set(k, v.trim()); };
  if (tree) Object.values(tree.nodes).forEach(n => add(n.owner));
  todos.forEach(t => add(t.name));
  Object.keys(LIST_SCHEMAS).forEach(k => (listsData[k] || []).forEach(e => { add(e.requestedBy); add(e.submittedBy); }));
  return Array.from(map.values()).sort((a, b) => a.localeCompare(b));
}

window.setOwnerFilter = function(value) {
  ownerFilter = value ? value : null;
  editingId = null;
  addingChildOf = null;
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
};

window.jumpToNode = function(id) {
  ownerFilter = null;
  currentId = id;
  render();
};

window.printReport = function() { window.print(); };

function renderPersonReport() {
  const target = normName(ownerFilter);
  const label = escapeHtml(ownerFilter);

  const tasks = tree
    ? Object.values(tree.nodes)
        .filter(n => normName(n.owner) === target)
        .sort((a, b) => STATUSES.indexOf(a.status) - STATUSES.indexOf(b.status))
    : [];
  const todoMatches = todos.filter(t => normName(t.name) === target);
  const listMatches = [];
  Object.keys(LIST_SCHEMAS).forEach(k => {
    (listsData[k] || []).forEach(e => {
      if (normName(e.requestedBy) === target || normName(e.submittedBy) === target) {
        listMatches.push({ schema: LIST_SCHEMAS[k], entry: e });
      }
    });
  });

  const total = tasks.length + todoMatches.length + listMatches.length;

  let html = '<div class="report">';
  html += '<div class="report-head">' +
    '<h2>Assigned to ' + label + '</h2>' +
    '<div class="report-head-actions">' +
      '<span class="report-count">' + total + ' item' + (total === 1 ? '' : 's') + '</span>' +
      '<button class="icon-btn" onclick="printReport()">Print</button>' +
      '<button class="icon-btn" onclick="setOwnerFilter(\'\')">Back to board</button>' +
    '</div>' +
  '</div>';

  if (total === 0) {
    html += '<div class="report-empty">Nothing is assigned to ' + label + ' yet. ' +
      'Assignments come from the <strong>Owner</strong> field on a task, the <strong>Name</strong> on a to-do, ' +
      'and <strong>Requested by</strong> / <strong>Submitted by</strong> on the team lists.</div>';
    html += '</div>';
    return html;
  }

  if (tasks.length) {
    html += '<div class="report-group"><h3>Tasks (' + tasks.length + ')</h3>';
    tasks.forEach(n => {
      const path = getPath(n.id);
      const trail = path.slice(0, -1).map(p => escapeHtml(p.title)).join(' › ');
      const kids = n.children.length;
      html += '<div class="report-row" onclick="jumpToNode(\'' + n.id + '\')">' +
        '<div class="rr-title">' + escapeHtml(n.title) + '</div>' +
        (n.description ? '<div class="rr-sub">' + escapeHtml(n.description) + '</div>' : '') +
        (trail ? '<div class="rr-path">' + trail + '</div>' : '') +
        '<div class="rr-foot">' +
          '<span class="status-pill ' + STATUS_CLASS[n.status] + '">' + n.status + '</span>' +
          (kids ? '<span class="subtask-count">' + kids + ' subtask' + (kids === 1 ? '' : 's') + '</span>' : '') +
        '</div>' +
      '</div>';
    });
    html += '</div>';
  }

  if (todoMatches.length) {
    html += '<div class="report-group"><h3>To-dos (' + todoMatches.length + ')</h3>';
    todoMatches.forEach(t => {
      const wsName = workstreamTitle(t.workstream);
      html += '<div class="report-row static">' +
        '<div class="rr-title' + (t.done ? ' rr-done' : '') + '">' + escapeHtml(t.text) + '</div>' +
        (wsName ? '<div class="rr-path">' + escapeHtml(wsName) + '</div>' : '') +
        '<div class="rr-foot">' +
          (t.deadline ? '<span class="rr-path">Due ' + escapeHtml(formatDeadline(t.deadline)) + '</span>' : '') +
          '<span class="status-pill ' + (t.done ? 'status-done">Done' : 'status-in-progress">Open') + '</span>' +
        '</div>' +
      '</div>';
    });
    html += '</div>';
  }

  if (listMatches.length) {
    html += '<div class="report-group"><h3>Team lists (' + listMatches.length + ')</h3>';
    listMatches.forEach(m => {
      const first = m.schema.fields[0].id;
      html += '<div class="report-row static">' +
        '<div class="rr-title">' + escapeHtml(m.entry[first] || '(untitled)') + '</div>' +
        '<div class="rr-path">' + escapeHtml(m.schema.title) + '</div>' +
        (m.entry.status ? '<div class="rr-foot"><span class="status-pill status-in-progress">' + escapeHtml(m.entry.status) + '</span></div>' : '') +
      '</div>';
    });
    html += '</div>';
  }

  html += '</div>';
  return html;
}

function render() {
  const app = document.getElementById("app");
  document.body.classList.toggle("readonly", READONLY);
  // The three loaders (tree / lists / todos) each call render() when they
  // finish, in whatever order they resolve. The board needs the tree.
  if (!tree) return;

  const names = allOwnerNames();
  let selector = '';
  if (names.length) {
    const opts = names.slice();
    if (ownerFilter && !opts.some(n => normName(n) === normName(ownerFilter))) opts.push(ownerFilter);
    selector = '<select class="owner-select" onchange="setOwnerFilter(this.value)" title="Show everything assigned to one person">' +
      '<option value="">Cube9 board</option>' +
      opts.map(nm => '<option value="' + escapeHtml(nm) + '"' +
        (ownerFilter && normName(nm) === normName(ownerFilter) ? ' selected' : '') + '>' +
        escapeHtml(nm) + ' \u2014 assignments</option>').join('') +
      '</select>';
  }

  let html = '';
  if (READONLY) {
    const when = SNAP.generated_at ? String(SNAP.generated_at).slice(0, 10) : "";
    html += '<div class="snapshot-banner">Offline snapshot' + (when ? ' \u00b7 ' + escapeHtml(when) : '') +
      ' \u2014 read only. <a href="' + LIVE_URL + '">Open the live app</a></div>';
  }
  html += '<div class="topbar">' +
    '<div><h1>IronOwl Cube9</h1><div class="sub">Shared with your team \u2014 click any task to open its subtasks</div></div>' +
    '<div class="topbar-actions">' +
      selector +
      '<button class="icon-btn" onclick="document.getElementById(\'team-lists\').scrollIntoView({behavior:\'smooth\'})">Team lists \u2193</button>' +
      (READONLY ? '' : '<button class="icon-btn" onclick="refreshFromStorage()">Refresh</button>') +
    '</div>' +
  '</div>';

  if (banner) {
    html += '<div class="status-banner ' + banner.type + '" onclick="dismissBanner()">' + escapeHtml(banner.text) + ' (dismiss)</div>';
  }

  if (ownerFilter) {
    html += renderPersonReport();
  } else {
    const node = getNode(currentId);
    const path = getPath(currentId);
    const children = node.children.map(id => getNode(id)).filter(Boolean);
    const ringChildren = children.slice(0, 8);
    const overflowChildren = children.slice(8);

    html += renderBreadcrumb(path);

    // 3x3 board: center = current node, ring = up to 8 children
    const ringOrder = [0, 1, 2, 3, 5, 6, 7, 8]; // grid positions skipping center (4)
    const cells = new Array(9).fill(null);
    cells[4] = renderCenterCell(node);
    ringOrder.forEach((pos, i) => {
      cells[pos] = ringChildren[i] ? renderChildCell(ringChildren[i]) : renderEmptyCell();
    });

    html += '<div class="board">' + cells.join('') + '</div>';

    html += '<div class="board-note">' + children.length + ' subtask' + (children.length === 1 ? '' : 's') +
      (addingChildOf === node.id ? '' : ' \u00b7 <span style="text-decoration:underline;cursor:pointer;" onclick="startAddChild(\'' + node.id + '\')">+ add another</span>') +
    '</div>';

    if (addingChildOf === node.id) {
      html += renderAddCard(node.id);
    }

    if (overflowChildren.length > 0) {
      html += '<div class="overflow-heading">' + overflowChildren.length + ' more subtask' + (overflowChildren.length === 1 ? '' : 's') + ' (beyond the board\u2019s 8 slots)</div>';
      html += '<div class="children-grid">';
      overflowChildren.forEach(child => { html += renderChildCard(child); });
      html += '</div>';
    }
  }

  html += renderTeamLists();

  app.innerHTML =
    '<div class="layout">' +
      '<div class="main-col">' + html + '</div>' +
      '<div class="todo-col">' + renderTodoPanel() + '</div>' +
    '</div>';
}

loadTree();
loadLists();
loadTodos();
subscribeToLiveUpdates();
</script>
</body>
